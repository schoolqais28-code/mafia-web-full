<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الموقع تحت الصيانة</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#4a0714,#08070b 45%);color:#fff;font-family:Arial,Tahoma,sans-serif;padding:20px}
.card{width:min(620px,100%);text-align:center;background:#0e0c10e8;border:1px solid #ffffff15;border-radius:28px;padding:38px;box-shadow:0 30px 100px #000}
.logo{width:110px;height:110px;border-radius:24px;box-shadow:0 0 45px #b20b2944}.tag{color:#e64a59;font-weight:700}.card h1{font-size:38px;margin:18px 0 10px}.card p{color:#b5acab;font-size:18px;line-height:1.8}
button,a{display:inline-block;border:0;border-radius:12px;padding:13px 20px;margin:7px;text-decoration:none;font:inherit;cursor:pointer}.retry{background:linear-gradient(135deg,#d11e2f,#780716);color:#fff;font-weight:700}.admin{background:#ffffff0b;border:1px solid #ffffff1d;color:#fff}
</style>
</head>
<body>
<div class="card">
<img class="logo" src="/assets/logo.svg" alt="MAFIA">
<div class="tag">تحديث جاري</div>
<h1>الموقع تحت الصيانة</h1>
<p id="msg">نعمل حاليًا على تحديث الموقع وسنعود قريبًا</p>
<button class="retry" onclick="location.reload()">إعادة المحاولة</button>
<a class="admin" href="/admin">دخول الإدارة</a>
</div>
<script>
fetch("/api/site").then(r=>r.json()).then(j=>{if(!j.maintenance)location.href="/";if(j.maintenanceMessage)document.getElementById("msg").textContent=j.maintenanceMessage}).catch(()=>{});
</script>
</body></html>
