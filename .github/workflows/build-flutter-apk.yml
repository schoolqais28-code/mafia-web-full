name: Build Native Flutter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android Flutter shell
        run: |
          rm -rf /tmp/mafia_flutter_build
          flutter create --platforms=android --org com.qais --project-name mafia_flutter /tmp/mafia_flutter_build
          cp flutter_app/pubspec.yaml /tmp/mafia_flutter_build/pubspec.yaml
          rm -rf /tmp/mafia_flutter_build/lib
          cp -R flutter_app/lib /tmp/mafia_flutter_build/lib
          rm -rf /tmp/mafia_flutter_build/test

      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/mafia_flutter_build/android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'''
          s = s.replace(marker, permissions)
          s = s.replace('android:label="mafia_flutter"', 'android:label="MAFIA"')
          p.write_text(s)

          g = Path('/tmp/mafia_flutter_build/android/app/build.gradle.kts')
          if g.exists():
              t = g.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              g.write_text(t)
          PY

      - name: Get packages
        working-directory: /tmp/mafia_flutter_build
        run: flutter pub get

      - name: Analyze Dart
        working-directory: /tmp/mafia_flutter_build
        run: flutter analyze

      - name: Build release APK
        working-directory: /tmp/mafia_flutter_build
        run: flutter build apk --release

      - name: Copy APK
        run: |
          cp /tmp/mafia_flutter_build/build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/mafia-flutter-native.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mafia-flutter-native-apk
          path: mafia-flutter-native.apk
          if-no-files-found: error
