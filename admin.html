<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة مافيا</title><link rel="stylesheet" href="/style.css"><style>
body{background:#08070b}.wrap{max-width:1300px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top a{color:white;text-decoration:none}.metrics,.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{background:#0e0c10;border:1px solid #ffffff12;border-radius:16px;padding:16px;margin:12px 0}.metric b{display:block;font-size:30px}.muted{color:#918784}.row{display:flex;gap:8px;align-items:center}.row input{margin:0}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid #ffffff10;text-align:right}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button,.room button{background:#171319;border:1px solid #ffffff18;color:#eee;border-radius:8px;padding:6px 9px}.danger{color:#ff7f8b!important;border-color:#6a1b25!important}.room{background:#0a090c;border-radius:12px;padding:12px}.players{display:grid;gap:5px;margin:8px 0}.players div{display:flex;justify-content:space-between;background:#ffffff05;padding:6px;border-radius:7px}@media(max-width:800px){.metrics,.rooms{grid-template-columns:1fr}.top,.row{align-items:stretch;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>لوحة إدارة الموقع</h1><div class="muted">الحد الأدنى لبدء اللعبة 6 لاعبين</div></div><a class="ghost" href="/">العودة للموقع</a></div>
<div id="metrics" class="metrics"></div>
<div class="box"><h2>الإعلان العام</h2><div class="row"><input id="ann" maxlength="240" placeholder="اكتب إعلانًا عامًا"><button class="primary" id="saveAnn">حفظ</button></div></div>
<div class="box"><div class="top"><div><h2>الحسابات</h2><div class="muted">حظر وإدارة الصلاحيات والإحصائيات</div></div><input id="search" placeholder="بحث باسم المستخدم" style="max-width:280px"></div><div class="table"><table><thead><tr><th>المستخدم</th><th>الحالة</th><th>الدور</th><th>الألعاب</th><th>الفوز</th><th>الإجراءات</th></tr></thead><tbody id="users"></tbody></table></div></div>
<div class="box"><h2>الغرف النشطة</h2><div id="rooms" class="rooms"></div></div>
<div class="box"><h2>سجل الإدارة</h2><div id="audit"></div></div>
</div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(u,o={}){const r=await fetch(u,{headers:{"Content-Type":"application/json"},...o}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"حدث خطأ");return j}
async function overview(){const o=await api("/api/admin/overview");$("#metrics").innerHTML=[["الحسابات",o.totalUsers],["الغرف",o.activeRooms],["اللاعبون الآن",o.activePlayers],["المتصلون",o.connectedSockets],["المحظورون",o.bannedUsers],["المشرفون",o.admins]].map(x=>'<div class="box metric"><span class="muted">'+x[0]+'</span><b>'+(x[1]||0)+'</b></div>').join("");$("#ann").value=o.announcement||""}
async function users(){const q=encodeURIComponent($("#search").value.trim()),j=await api("/api/admin/users"+(q?"?q="+q:""));$("#users").innerHTML=j.users.map(u=>'<tr><td><b>'+esc(u.username)+'</b><div class="muted">#'+u.id+'</div></td><td>'+(u.is_banned?"محظور":"نشط")+'</td><td>'+(u.is_admin?"مشرف":"لاعب")+'</td><td>'+u.games+'</td><td>'+u.wins+'</td><td class="actions"><button data-id="'+u.id+'" data-a="'+(u.is_banned?"unban":"ban")+'">'+(u.is_banned?"فك الحظر":"حظر")+'</button><button data-id="'+u.id+'" data-a="'+(u.is_admin?"revoke_admin":"grant_admin")+'">'+(u.is_admin?"إلغاء الإدارة":"جعله مشرف")+'</button><button data-id="'+u.id+'" data-a="reset_stats">تصفير</button><button class="danger" data-del="'+u.id+'">حذف</button></td></tr>').join("");document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{try{await api("/api/admin/users/"+b.dataset.id+"/action",{method:"POST",body:JSON.stringify({action:b.dataset.a})});await all()}catch(e){alert(e.message)}});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("حذف الحساب نهائيًا؟"))try{await api("/api/admin/users/"+b.dataset.del,{method:"DELETE"});await all()}catch(e){alert(e.message)}})}
async function rooms(){const j=await api("/api/admin/rooms");$("#rooms").innerHTML=j.rooms.length?j.rooms.map(r=>'<div class="room"><b>'+esc(r.code)+'</b><div class="muted">'+r.players.length+'/'+r.maxPlayers+' لاعبين • '+(r.started?"بدأت":"انتظار")+'</div><div class="players">'+r.players.map(p=>'<div><span>'+esc(p.name)+'</span><button data-k="'+esc(p.id)+'" data-r="'+esc(r.code)+'">إخراج</button></div>').join("")+'</div><button class="danger" data-close="'+esc(r.code)+'">إغلاق الغرفة</button></div>').join(""):'<div class="muted">لا توجد غرف نشطة</div>';document.querySelectorAll("[data-close]").forEach(b=>b.onclick=async()=>{if(confirm("إغلاق الغرفة؟")){await api("/api/admin/rooms/"+b.dataset.close+"/close",{method:"POST"});await all()}});document.querySelectorAll("[data-k]").forEach(b=>b.onclick=async()=>{await api("/api/admin/rooms/"+b.dataset.r+"/kick",{method:"POST",body:JSON.stringify({socketId:b.dataset.k})});await all()})}
async function audit(){const j=await api("/api/admin/audit");$("#audit").innerHTML=j.logs.map(l=>'<div style="padding:8px;border-bottom:1px solid #ffffff0b"><b>'+esc(l.action)+'</b> <span class="muted">'+esc(l.details||"")+' • '+esc(l.admin_username||"system")+' • '+esc(l.created_at)+'</span></div>').join("")||'<div class="muted">لا توجد عمليات بعد</div>'}
async function all(){try{await Promise.all([overview(),users(),rooms(),audit()])}catch(e){alert(e.message);location.href="/"}}
$("#saveAnn").onclick=async()=>{try{await api("/api/admin/announcement",{method:"POST",body:JSON.stringify({message:$("#ann").value})});await all()}catch(e){alert(e.message)}};let t;$("#search").oninput=()=>{clearTimeout(t);t=setTimeout(users,250)};all();setInterval(()=>{overview().catch(()=>{});rooms().catch(()=>{})},15000);
</script></body></html>
